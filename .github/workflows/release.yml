name: Release

on:
  push:
    tags: [ 'v*.*.*' ]
    branches: [ main ]
    paths: [ 'VERSION' ]          # VERSION dosyası değişince otomatik sürüm
  workflow_dispatch:
    inputs:
      version:
        description: 'Sürüm (ör. 1.2.0). Boş bırakılırsa VERSION dosyası kullanılır.'
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Sürümü belirle
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart('v') }
          elseif ("${{ github.event.inputs.version }}") { $v = "${{ github.event.inputs.version }}".TrimStart('v') }
          else { $v = (Get-Content VERSION -Raw).Trim() }
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "Geçersiz sürüm: $v" }
          git fetch --tags --quiet
          $exists = git tag -l "v$v"
          if ($exists -and "${{ github.ref_type }}" -ne "tag") { throw "v$v zaten yayınlanmış. VERSION dosyasını artırın." }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT

      - name: Native hook (MSVC x64 + x86)
        shell: pwsh
        run: ./build.ps1 -NativeOnly

      - name: Test + publish (framework-dependent)
        shell: pwsh
        run: |
          ./build.ps1 -Version "${{ steps.ver.outputs.version }}"
          Rename-Item dist/GameSubTR-win-x64.zip "GameSubTR-${{ steps.ver.outputs.version }}-win-x64.zip"

      - name: Publish (self-contained)
        shell: pwsh
        run: |
          ./build.ps1 -Version "${{ steps.ver.outputs.version }}" -SelfContained -SkipTests
          Rename-Item dist/GameSubTR-win-x64.zip "GameSubTR-${{ steps.ver.outputs.version }}-win-x64-selfcontained.zip"

      - name: SHA256
        shell: pwsh
        run: |
          Get-ChildItem dist/*.zip | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: GameSubTR ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          body: |
            ## İndirme
            - **GameSubTR-${{ steps.ver.outputs.version }}-win-x64-selfcontained.zip** — önerilen, .NET kurmaya gerek yok
            - **GameSubTR-${{ steps.ver.outputs.version }}-win-x64.zip** — daha küçük, .NET 8 Desktop Runtime gerekir

            Kurulum: zip'i bir klasöre çıkar → `GameSubTR.exe`. İlk kurulumda İngilizce OCR paketi için README'ye bak.
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
