name: CI

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', 'docs/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Native hook (MSVC x64 + x86)
        shell: pwsh
        run: ./build.ps1 -NativeOnly

      - name: Test + publish
        shell: pwsh
        run: ./build.ps1 -Version "0.0.${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: GameSubTR-win-x64-ci${{ github.run_number }}
          path: dist/GameSubTR-win-x64.zip
          retention-days: 14
