name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build native hook (MSVC, x64 + x86)
        shell: pwsh
        run: |
          foreach ($a in @(@{A='x64';B='64'}, @{A='Win32';B='32'})) {
            cmake -S native -B "native/build-msvc-$($a.B)" -A $a.A
            cmake --build "native/build-msvc-$($a.B)" --config Release
            New-Item -ItemType Directory -Force native/bin | Out-Null
            Copy-Item "native/build-msvc-$($a.B)/Release/GameSubTR.Hook$($a.B).dll","native/build-msvc-$($a.B)/Release/GameSubTR.Injector$($a.B).exe" native/bin -Force
          }

      - name: Test, publish, zip
        shell: pwsh
        run: ./build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: GameSubTR-win-x64
          path: dist/GameSubTR-win-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GameSubTR-win-x64.zip
